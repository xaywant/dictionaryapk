name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare files
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp icon-only.png icon-foreground.png icon-background.png assets/
      - run: npm install
      - run: npx cap add android
      - name: Make launcher icons
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#fdbb93' --iconBackgroundColorDark '#fdbb93'
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Dictionary.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Dictionary-apk
          path: Dictionary.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dictionary (latest build)
          files: Dictionary.apk
